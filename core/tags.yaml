lint: Linter・Formatter
testing: テスト設計・テスト指針
tools: 開発ツール
writing: 人間向けの文書の書き方
agents: AI エージェントの用意と役割設定
process: 開発プロセス

# 言語
go: Go
typescript: TypeScript
